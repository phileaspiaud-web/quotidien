name: Construire l'APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer l'icône
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#121211' --iconBackgroundColorDark '#121211' --splashBackgroundColor '#121211' --splashBackgroundColorDark '#121211'
        continue-on-error: true

      - name: Synchroniser
        run: npx cap sync android

      - name: Clé de signature fixe (pour pouvoir mettre à jour sans désinstaller)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Construire l'APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Quotidien.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Quotidien-apk
          path: app/Quotidien.apk

      - name: Publier dans "Releases"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Quotidien.apk --title "Mon quotidien – APK" --notes "Télécharge Quotidien.apk sur ton téléphone Android et installe-le."
