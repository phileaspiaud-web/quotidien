<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mon quotidien</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#fafaf9;--fg:#1c1c1a;--mut:#8a8a85;--line:#e7e6e3;--card:#fff;--sport:#2f9e6b;--biz:#3b6fd8;}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--fg:#ededea;--mut:#7c7c77;--line:#262624;--card:#1a1a19;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.date{color:var(--mut);font-size:13px;text-transform:capitalize}
.tabs{display:flex;gap:4px;background:var(--line);padding:3px;border-radius:10px;margin-bottom:22px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:14px;font-weight:500;padding:9px 4px;white-space:nowrap;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06)}
form{display:flex;gap:8px;margin-bottom:18px}
form input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:12px 14px;border-radius:10px;outline:none}
form input:focus{border-color:var(--mut)}
.cat{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:13px;font-weight:500;padding:0 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.sport{background:var(--sport)}.dot.business{background:var(--biz)}
.add{border:0;background:var(--fg);color:var(--bg);font:inherit;font-size:22px;width:46px;border-radius:10px;cursor:pointer}
ul{list-style:none}
.task{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);transition:opacity .35s,transform .35s}
.task.gone{opacity:0;transform:translateX(16px)}
.check{width:22px;height:22px;border:1.5px solid var(--mut);border-radius:6px;background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent;font-size:13px}
.task.gone .check{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.txt{flex:1;line-height:1.35;word-break:break-word}
.del{border:0;background:none;color:var(--mut);cursor:pointer;font-size:20px;opacity:.45;padding:0 6px}
.empty{color:var(--mut);text-align:center;padding:40px 0;font-size:14px}
.day{margin-bottom:26px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px;padding:0 4px}
.dayh b{color:var(--fg);font-weight:600;text-transform:capitalize}
.done{display:flex;align-items:center;gap:12px;padding:10px 4px;font-size:15px}
.time{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;width:38px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:10px;font-size:14px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.15);white-space:nowrap}
.toast button{border:0;background:none;color:var(--bg);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.hr{display:flex;align-items:center;gap:10px}
.st{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.st.ok{background:var(--sport)}.st.err{background:#d9534f}.st.sync{background:#e0a23b}
.gear{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:2px 4px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mut);margin-bottom:18px}
.banner button,.btn{border:0;background:var(--fg);color:var(--bg);font:inherit;font-size:14px;font-weight:500;padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.panel h2{font-size:17px;font-weight:600;margin-bottom:8px}
.panel p{color:var(--mut);font-size:14px;line-height:1.45;margin-bottom:14px}
.panel input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:12px 14px;border-radius:10px;outline:none;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:13px;margin-top:10px;color:var(--mut)}
.note{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;padding:14px 4px;cursor:pointer}
.note b{display:block;font-weight:600;margin-bottom:3px}
.note span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.link{border:0;background:none;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
.ntitle{width:100%;border:0;background:none;color:var(--fg);font:inherit;font-size:22px;font-weight:600;outline:none;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.big{width:100%;border:0;background:var(--fg);color:var(--bg);font:inherit;font-size:16px;font-weight:600;padding:14px;border-radius:12px;cursor:pointer;margin-bottom:26px}
.sess h2{font-size:18px;font-weight:600;margin-bottom:14px}
.set{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.set .n{color:var(--mut);font-size:13px;width:62px}
.set .r{flex:1;font-weight:600}
.res{text-align:center;padding:26px 0 30px}
.res .tot{font-size:52px;font-weight:700;letter-spacing:-.03em}
.res .sub{color:var(--mut);margin-top:4px}
.res .cmp{margin-top:10px;font-size:14px;font-weight:500}
.sm{color:var(--mut);font-size:13px}
.nbody{width:100%;min-height:55vh;border:0;background:none;color:var(--fg);font:inherit;line-height:1.6;outline:none;resize:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
var OWNER='phileaspiaud-web', REPO='quotidien-data', FILE='data.json';
var LS='quotidien-v2', LS_OLD='quotidien-state', LS_TOKEN='quotidien-token';
var TOKEN=''; try{TOKEN=localStorage.getItem(LS_TOKEN)||''}catch(e){}

// ---- Données : un "item" par tâche, avec la date de dernière modif (pour fusionner entre appareils)
var S={items:{}};
try{var l=JSON.parse(localStorage.getItem(LS));if(l&&l.items)S=l}catch(e){}
// Reprise de l'ancienne version (avant la synchro)
try{var old=JSON.parse(localStorage.getItem(LS_OLD));
  if(old&&!Object.keys(S.items).length){var now=Date.now();
    (old.tasks||[]).forEach(function(t){S.items[t.id]={id:t.id,text:t.text,cat:t.cat,created:t.created,doneAt:null,deleted:false,updated:now}});
    (old.done||[]).forEach(function(d){S.items[d.id]={id:d.id,text:d.text,cat:d.cat,created:d.created,doneAt:d.doneAt,deleted:false,updated:now}});
  }}catch(e){}

var tab='today', cat='sport', undo=null, undoTimer=null, status=TOKEN?'sync':'off', setMsg='';

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function key(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayLabel(k){
  if(k===key(Date.now()))return "Aujourd'hui";
  var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2]).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
var CATS={sport:'Sport',business:'Business'};
function all(){return Object.keys(S.items).map(function(k){return S.items[k]}).filter(function(i){return !i.deleted&&!i.kind})}
function kind(k){return Object.keys(S.items).map(function(x){return S.items[x]}).filter(function(i){return !i.deleted&&i.kind===k})}
function sessions(){return kind('session')}
function activeSess(){return sessions().filter(function(x){return !x.endedAt}).sort(function(a,b){return b.created-a.created})[0]}
function exos(){var seen={},out=[];['Pompes'].concat(kind('exo').sort(function(a,b){return a.created-b.created}).map(function(e){return e.name}),sessions().map(function(x){return x.exo}))
  .forEach(function(n){if(!n)return;var k=n.toLowerCase();if(!seen[k]){seen[k]=1;out.push(n)}});return out}
function sum(a){return (a||[]).reduce(function(x,y){return x+y},0)}
var exo='Pompes', justDone=null, addingExo=false;
function notes(){return Object.keys(S.items).map(function(k){return S.items[k]}).filter(function(i){return !i.deleted&&i.kind==='note'}).sort(function(a,b){return b.updated-a.updated})}
var openNote=null;
function todo(){return all().filter(function(i){return !i.doneAt}).sort(function(a,b){return a.created-b.created})}
function done(){return all().filter(function(i){return i.doneAt})}
function touch(it,ch){for(var k in ch)it[k]=ch[k];it.updated=Date.now();saveLocal();queueSync();}
function setUndo(m,fn){undo={msg:m,fn:fn};clearTimeout(undoTimer);undoTimer=setTimeout(function(){undo=null;render()},4000);}

// ---- Synchro GitHub
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
function gh(method,body){
  return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+FILE+(method==='GET'?'?t='+Date.now():''),{
    method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+TOKEN,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body:body?JSON.stringify(body):undefined});
}
function merge(a,b){var out={},ids={};Object.keys(a).concat(Object.keys(b)).forEach(function(k){ids[k]=1});
  Object.keys(ids).sort().forEach(function(k){var x=a[k],y=b[k];out[k]=!x?y:!y?x:(y.updated>x.updated?y:x)});return out}
function canon(m){return JSON.stringify(Object.keys(m).sort().map(function(k){var i=m[k];return Object.keys(i).sort().map(function(f){return [f,i[f]]})}))}
var syncing=false, again=false, syncTimer=null;
function queueSync(){if(!TOKEN)return;clearTimeout(syncTimer);syncTimer=setTimeout(sync,1200)}
function setStatus(s){if(status!==s){status=s;var el=document.getElementById('st');if(el)el.className='st '+cls()}}
function cls(){return status==='ok'?'ok':status==='sync'?'sync':status==='off'?'':'err'}
async function sync(){
  if(!TOKEN)return;
  if(syncing){again=true;return}
  syncing=true;setStatus('sync');
  try{
    for(var attempt=0;attempt<4;attempt++){
      var r=await gh('GET'), remote={}, sha;
      if(r.status===200){var j=await r.json();sha=j.sha;try{remote=(JSON.parse(b64d(j.content)).items)||{}}catch(e){remote={}}}
      else if(r.status===401||r.status===403){setStatus('auth');render();return}
      else if(r.status!==404)throw new Error('get '+r.status);
      var before=canon(S.items), merged=merge(S.items,remote);
      S.items=merged;saveLocal();
      if(canon(merged)!==before&&tab!=='note')render();
      if(canon(merged)===canon(remote)){setStatus('ok');return}
      var p=await gh('PUT',{message:'Synchro '+new Date().toISOString(),content:b64e(JSON.stringify({v:1,items:merged})),sha:sha});
      if(p.ok){setStatus('ok');return}
      if(p.status===401||p.status===403){setStatus('auth');render();return}
      if(p.status!==409&&p.status!==422)throw new Error('put '+p.status);
    }
    setStatus('net');
  }catch(e){setStatus('net')}
  finally{syncing=false;if(again){again=false;sync()}}
}

// ---- Affichage
function render(){
  var r=document.getElementById('root');
  var today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var T=todo();
  var title={ok:'Synchronisé',sync:'Synchronisation…',net:'Hors ligne — se synchronisera plus tard',auth:'Clé invalide ou expirée',off:'Synchro désactivée'}[status]||'';
  var h='<div class="wrap"><header><h1>Mon quotidien</h1><div class="hr"><span class="date">'+today+'</span>'+
    '<span id="st" class="st '+cls()+'" title="'+title+'"></span><button class="gear" data-tab="set" aria-label="Réglages">⚙</button></div></header>';
  if(tab!=='set'){
    if(!TOKEN)h+='<div class="banner">Synchro entre appareils désactivée<button data-tab="set">Activer</button></div>';
    else if(status==='auth')h+='<div class="banner">Ta clé GitHub ne marche plus<button data-tab="set">Changer</button></div>';
    h+='<div class="tabs"><button data-tab="today" class="'+(tab==='today'?'on':'')+'">À faire'+(T.length?' · '+T.length:'')+'</button>'+
      '<button data-tab="hist" class="'+(tab==='hist'?'on':'')+'">Historique</button>'+
      '<button data-tab="notes" class="'+(tab==='notes'||tab==='note'?'on':'')+'">Notes</button>'+
      '<button data-tab="sport" class="'+(tab==='sport'?'on':'')+'">Sport</button></div>';
  }
  if(tab==='today'){
    h+='<form id="f"><input id="in" placeholder="Nouvelle tâche…" autocomplete="off" enterkeyhint="done">'+
      '<button type="button" class="cat" id="cat"><span class="dot '+cat+'"></span>'+CATS[cat]+'</button>'+
      '<button class="add" aria-label="Ajouter">+</button></form>';
    if(!T.length)h+='<p class="empty">Rien à faire pour l\'instant ✨</p>';
    else{h+='<ul>';T.forEach(function(t){
      h+='<li class="task"><button class="check" data-check="'+t.id+'" aria-label="Valider">✓</button>'+
        '<span class="dot '+t.cat+'"></span><span class="txt">'+esc(t.text)+'</span>'+
        '<button class="del" data-del="'+t.id+'" aria-label="Supprimer">×</button></li>';});h+='</ul>';}
  }else if(tab==='sport'){
    var A=activeSess(), J=justDone&&S.items[justDone];
    if(A){
      h+='<div class="sess"><h2>'+esc(A.exo)+' · en cours</h2>';
      (A.sets||[]).forEach(function(r,ix){h+='<div class="set"><span class="n">Série '+(ix+1)+'</span><span class="r">'+r+' reps</span><button class="del" data-sdel="'+ix+'" aria-label="Supprimer">×</button></div>'});
      if(!(A.sets||[]).length)h+='<p class="sm" style="padding:8px 4px">Fais ta première série, puis note tes reps 👇</p>';
      h+='<form id="fs" style="margin-top:16px"><input id="reps" type="number" inputmode="numeric" min="1" placeholder="Reps de la série '+((A.sets||[]).length+1)+'" autocomplete="off">'+
        '<button class="add" aria-label="Ajouter">+</button></form>'+
        '<button class="big" id="finish"'+((A.sets||[]).length?'':' disabled style="opacity:.4"')+'>Fini ✓</button>'+
        '<div style="text-align:center;margin-top:-14px;margin-bottom:20px"><button class="link" id="cancelsess">Annuler la séance</button></div></div>';
    }else if(J&&!J.deleted){
      var prev=sessions().filter(function(x){return x.endedAt&&x.exo===J.exo&&x.id!==J.id&&x.endedAt<J.endedAt}).sort(function(a,b){return b.endedAt-a.endedAt})[0];
      var tot=sum(J.sets), diff=prev?tot-sum(prev.sets):null;
      h+='<div class="res"><div class="sm">'+esc(J.exo)+'</div><div class="tot">'+tot+'</div><div class="sub">reps en '+J.sets.length+' série'+(J.sets.length>1?'s':'')+'</div>'+
        (diff===null?'<div class="cmp">Première séance enregistrée 🎉</div>':
          '<div class="cmp" style="color:'+(diff>0?'var(--sport)':diff<0?'#d9534f':'var(--mut)')+'">'+(diff>0?'+'+diff+' vs la dernière fois 🔥':diff<0?diff+' vs la dernière fois':'Pareil que la dernière fois')+'</div>')+
        '</div><button class="big" id="okdone">OK</button>';
    }else{
      h+='<div class="chips">';exos().forEach(function(n){h+='<button class="chip'+(n===exo?' on':'')+'" data-exo="'+esc(n)+'">'+esc(n)+'</button>'});
      h+='<button class="chip" id="addexo">+ Exo</button></div>';
      if(addingExo)h+='<form id="fe"><input id="exoname" placeholder="Nom de l\'exo (ex : Abdos)" autocomplete="off"><button class="add" aria-label="Ajouter">+</button></form>';
      h+='<button class="big" id="startsess">Commencer · '+esc(exo)+'</button>';
    }
    var past=sessions().filter(function(x){return x.endedAt}).sort(function(a,b){return b.endedAt-a.endedAt});
    if(past.length){var gs={};past.forEach(function(x){var k=key(x.endedAt);(gs[k]=gs[k]||[]).push(x)});
      Object.keys(gs).sort().reverse().forEach(function(k){
        h+='<div class="day"><div class="dayh"><b>'+dayLabel(k)+'</b></div>';
        gs[k].forEach(function(x){var tm=new Date(x.endedAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
          h+='<div class="done"><span class="time">'+tm+'</span><span class="txt"><b>'+esc(x.exo)+'</b> · '+sum(x.sets)+' reps<br><span class="sm">'+x.sets.join(' · ')+'</span></span><button class="del" data-sessdel="'+x.id+'" aria-label="Supprimer">×</button></div>'});
        h+='</div>';});}
  }else if(tab==='notes'){
    h+='<form id="fn"><input id="nn" placeholder="Nouvelle note (ex : Sport)…" autocomplete="off" enterkeyhint="done">'+
      '<button class="add" aria-label="Créer">+</button></form>';
    var N=notes();
    if(!N.length)h+='<p class="empty">Aucune note pour l\'instant 📝</p>';
    else N.forEach(function(n){var lines=(n.body||'').split('\n').map(function(x){return x.trim()}).filter(Boolean);
      h+='<button class="note" data-open="'+n.id+'"><b>'+esc(n.title||'Sans titre')+'</b><span>'+(lines.length?esc(lines.join(' · ')):'Vide')+'</span></button>';});
  }else if(tab==='note'){
    var n=S.items[openNote];
    if(!n||n.deleted){tab='notes';return render();}
    h+='<div class="nbar"><button class="link" data-tab="notes">← Notes</button><button class="link" data-ndel="'+n.id+'">Supprimer</button></div>'+
      '<input class="ntitle" id="nt" value="'+esc(n.title||'')+'" placeholder="Titre">'+
      '<textarea class="nbody" id="nb" placeholder="Écris ici… (une chose par ligne)">'+esc(n.body||'')+'</textarea>';
  }else if(tab==='hist'){
    var D=done();
    if(!D.length)h+='<p class="empty">Ton historique apparaîtra ici dès ta première tâche validée.</p>';
    else{
      var g={};D.forEach(function(d){var k=key(d.doneAt);(g[k]=g[k]||[]).push(d)});
      Object.keys(g).sort().reverse().forEach(function(k){
        var items=g[k].sort(function(a,b){return b.doneAt-a.doneAt});
        h+='<div class="day"><div class="dayh"><b>'+dayLabel(k)+'</b><span>'+items.length+' tâche'+(items.length>1?'s':'')+'</span></div>';
        items.forEach(function(d){var tm=new Date(d.doneAt).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
          h+='<div class="done"><span class="time">'+tm+'</span><span class="dot '+d.cat+'"></span><span class="txt">'+esc(d.text)+'</span><button class="del" data-hdel="'+d.id+'" aria-label="Supprimer">×</button></div>';});
        h+='</div>';});
    }
  }else{
    h+='<div class="panel"><h2>Synchronisation</h2>';
    if(TOKEN&&status!=='auth'){
      h+='<p>Tes tâches sont synchronisées entre tous tes appareils où cette clé est enregistrée.</p>'+
        '<div class="row"><button class="btn" id="syncnow">Synchroniser maintenant</button><button class="btn ghost" id="logout">Retirer la clé</button></div>';
    }else{
      h+='<p>Colle ici ta clé GitHub (elle commence par <b>github_pat_</b>). Tu ne le fais qu\'une fois par appareil.</p>'+
        '<input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">'+
        '<div class="row"><button class="btn" id="savetok">Enregistrer</button></div>';
    }
    h+='<div class="msg">'+(setMsg||title)+'</div>';
    h+='<div class="row" style="margin-top:22px"><button class="btn ghost" data-tab="today">← Retour</button></div></div>';
  }
  h+='</div>';
  if(undo)h+='<div class="toast">'+undo.msg+'<button id="undo">Annuler</button></div>';
  r.innerHTML=h;
}

document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='fs'){var A=activeSess();var ri=document.getElementById('reps'),rv=parseInt(ri.value,10);if(!A||!(rv>0))return;
    touch(A,{sets:(A.sets||[]).concat([rv])});render();var r2=document.getElementById('reps');if(r2)r2.focus();return}
  if(e.target.id==='fe'){var en=document.getElementById('exoname').value.trim();if(!en)return;
    if(exos().map(function(x){return x.toLowerCase()}).indexOf(en.toLowerCase())<0){var eid=uid();S.items[eid]={id:eid,kind:'exo',name:en,created:Date.now(),deleted:false,updated:0};touch(S.items[eid],{})}
    exo=exos().filter(function(x){return x.toLowerCase()===en.toLowerCase()})[0]||en;addingExo=false;render();return}
  if(e.target.id==='fn'){var ni=document.getElementById('nn'),nv=ni.value.trim();if(!nv)return;
    var nid=uid();S.items[nid]={id:nid,kind:'note',title:nv,body:'',created:Date.now(),deleted:false,updated:0};
    touch(S.items[nid],{});openNote=nid;tab='note';render();var b=document.getElementById('nb');if(b)b.focus();return}
  var i=document.getElementById('in');if(!i)return;var v=i.value.trim();if(!v)return;
  var id=uid();S.items[id]={id:id,text:v,cat:cat,created:Date.now(),doneAt:null,deleted:false,updated:0};
  touch(S.items[id],{});render();document.getElementById('in').focus();
});
document.addEventListener('click',async function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;setMsg='';render();return}
  if(t.dataset.exo){exo=t.dataset.exo;render();return}
  if(t.id==='addexo'){addingExo=!addingExo;render();var x2=document.getElementById('exoname');if(x2)x2.focus();return}
  if(t.id==='startsess'){var sid=uid();S.items[sid]={id:sid,kind:'session',exo:exo,sets:[],created:Date.now(),endedAt:null,deleted:false,updated:0};touch(S.items[sid],{});justDone=null;render();var r3=document.getElementById('reps');if(r3)r3.focus();return}
  if(t.dataset.sdel){var A2=activeSess();if(!A2)return;var ss=(A2.sets||[]).slice();ss.splice(+t.dataset.sdel,1);touch(A2,{sets:ss});render();return}
  if(t.id==='finish'){var A3=activeSess();if(!A3||!(A3.sets||[]).length)return;touch(A3,{endedAt:Date.now()});justDone=A3.id;render();return}
  if(t.id==='cancelsess'){var A4=activeSess();if(!A4)return;touch(A4,{deleted:true});setUndo('Séance annulée',function(){touch(A4,{deleted:false})});render();return}
  if(t.id==='okdone'){justDone=null;render();return}
  if(t.dataset.sessdel){var sx=S.items[t.dataset.sessdel];if(!sx)return;touch(sx,{deleted:true});if(justDone===sx.id)justDone=null;setUndo('Séance supprimée',function(){touch(sx,{deleted:false})});render();return}
  if(t.dataset.open){openNote=t.dataset.open;tab='note';render();return}
  if(t.dataset.ndel){var nn=S.items[t.dataset.ndel];if(!nn)return;touch(nn,{deleted:true});tab='notes';
    setUndo('Note supprimée',function(){touch(nn,{deleted:false})});render();return}
  if(t.id==='cat'){cat=cat==='sport'?'business':'sport';var v=document.getElementById('in').value;render();document.getElementById('in').value=v;return}
  if(t.dataset.del||t.dataset.hdel){
    var it=S.items[t.dataset.del||t.dataset.hdel];if(!it)return;
    touch(it,{deleted:true});
    setUndo(t.dataset.hdel?'Supprimée de l\'historique':'Tâche supprimée',function(){touch(it,{deleted:false})});render();return}
  if(t.dataset.check){
    var task=S.items[t.dataset.check];if(!task)return;
    t.closest('.task').classList.add('gone');
    setTimeout(function(){touch(task,{doneAt:Date.now()});
      setUndo('Tâche validée',function(){touch(task,{doneAt:null})});render();},350);return;
  }
  if(t.id==='undo'&&undo){var u=undo;undo=null;clearTimeout(undoTimer);u.fn();render();return}
  if(t.id==='savetok'){
    var v2=document.getElementById('tok').value.trim();if(!v2){setMsg='Colle ta clé d\'abord.';render();return}
    var prev=TOKEN;TOKEN=v2;setMsg='Vérification…';render();
    var ok=false;try{var r=await gh('GET');ok=(r.status===200||r.status===404)}catch(err){}
    if(!ok){TOKEN=prev;setMsg='Cette clé ne fonctionne pas. Vérifie qu\'elle a accès à quotidien-data avec Contents en Read and write.';render();return}
    try{localStorage.setItem(LS_TOKEN,TOKEN)}catch(err){}
    status='sync';setMsg='';tab='today';render();sync();return;
  }
  if(t.id==='logout'){TOKEN='';try{localStorage.removeItem(LS_TOKEN)}catch(err){}status='off';setMsg='Clé retirée de cet appareil.';render();return}
  if(t.id==='syncnow'){setMsg='';sync().then(render);return}
});
document.addEventListener('input',function(e){
  if(tab!=='note')return;var n=S.items[openNote];if(!n)return;
  if(e.target.id==='nt')touch(n,{title:e.target.value});
  if(e.target.id==='nb')touch(n,{body:e.target.value});
});
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();sync()}});
setInterval(function(){if(!document.hidden)sync()},60000);
window.addEventListener('online',function(){sync()});

saveLocal();render();sync();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
